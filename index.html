<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勉強チャンネル</title>
<style>
  :root {
    --paper: #F1F0EA;
    --ink: #23291F;
    --ink-soft: #5B6459;
    --line: #D8D6CB;
    --accent-math: #3D5A45;
    --accent-main: #6B4A2E;
    --accent-geo: #4A5A78;
    --accent-other: #7A4A5A;
    --card-bg: #FBFAF6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }

  header {
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    margin: 0 0 4px;
    font-family: "Hiragino Mincho ProN", "Shippori Mincho", "Yu Mincho", serif;
    font-weight: 600;
    font-size: clamp(22px, 4vw, 30px);
    letter-spacing: 0.02em;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 0;
    min-height: calc(100vh - 90px);
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  nav {
    border-right: 1px solid var(--line);
    padding: 18px 14px 40px;
    overflow-y: auto;
  }

  .group-title {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 20px 4px 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .group-title:first-child { margin-top: 4px; }

  .channel-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 10px 10px;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
  }

  .channel-btn:hover { background: var(--card-bg); }

  .channel-btn.active {
    background: var(--card-bg);
    box-shadow: inset 3px 0 0 var(--dot);
    font-weight: 600;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot);
    flex-shrink: 0;
  }

  main {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .player-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 620px;
    background: #111;
    border-radius: 6px;
    overflow: hidden;
  }

  .player-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .now-playing h2 {
    margin: 0 0 4px;
    font-size: 18px;
  }

  .now-playing p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .video-list-wrap {
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }

  .video-list-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .video-list-header h3 {
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  #video-count {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .video-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    max-height: 480px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .video-item {
    display: flex;
    flex-direction: column;
    gap: 0;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    padding: 0;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
  }

  .video-item img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #ddd;
  }

  .video-item .vi-title {
    font-size: 12.5px;
    padding: 8px 10px 10px;
    line-height: 1.4;
  }

  .video-item:hover { background: var(--paper); }

  .video-item.active {
    outline: 2px solid var(--accent-main);
    outline-offset: -2px;
    font-weight: 600;
  }

  .video-list-status {
    font-size: 13px;
    color: var(--ink-soft);
    padding: 8px 4px;
    grid-column: 1 / -1;
  }

  .video-search {
    display: block;
    width: 100%;
    margin-bottom: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--card-bg);
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
  }

  .video-search:focus {
    outline: 2px solid var(--accent-main);
    outline-offset: -1px;
  }

  footer {
    padding: 16px 24px 28px;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <h1>勉強チャンネル</h1>
  <p>見られる動画はここに並んでいるものだけです。チャンネルを選ぶと再生が始まります。</p>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="player-wrap">
      <iframe id="player"
        src=""
        title="動画プレイヤー"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen></iframe>
    </div>
    <div class="now-playing">
      <h2 id="now-title">読み込み中…</h2>
      <p id="now-desc"></p>
    </div>
    <div class="video-list-wrap">
      <div class="video-list-header">
        <h3>動画一覧</h3>
        <span id="video-count"></span>
      </div>
      <input type="text" id="video-search" class="video-search" placeholder="タイトルで絞り込み">
      <div id="video-list" class="video-list"></div>
    </div>
  </main>
</div>

<footer>
  このページに登録されているチャンネルの動画一覧を、YouTubeの検索や関連動画なしで再生できるようにしています。
</footer>

<script>
  const groups = [
    {
      name: "数学",
      color: "#3D5A45",
      channels: [
        { title: "超わかる！高校数学 II・B", id: "UCII49VK8oCs134zyyrxl0jg", desc: "難関大対策の高校数学解説" },
        { title: "超わかる！授業動画", id: "UCZUPMvvW1ggn4gbSY741LdA", desc: "数学・化学・英語の解説アニメ" },
        { title: "Stardy -河野玄斗の神授業", id: "UCySNyY7ZlIyIeQ0T_8ah4Vg", desc: "勉強法・数学・英語ほか" },
        { title: "タラ先生", id: "UC-0lnsGCgB9JTyMtHajRUrQ", desc: "アニメーションで学ぶ高校数学" },
        { title: "数学・英語のトリセツ!", id: "UC7zx7uOmqXsD153rPSUvxcg", desc: "数学・英語の解説動画" }
      ]
    },
    {
      name: "主要教科（映像授業）",
      color: "#6B4A2E",
      channels: [
        { title: "映像授業 Try IT（トライイット）", id: "UCcj-cHmS0uD91MLjtdiN89Q", desc: "中高5教科の授業動画" }
      ]
    },
    {
      name: "地理",
      color: "#4A5A78",
      channels: [
        { title: "ジオチャンネル 地理の講義", id: "UCzoGY9oIih_r3ZKlsQzM2EQ", desc: "系統地理・地誌の授業" }
      ]
    },
    {
      name: "学び方・その他",
      color: "#7A4A5A",
      channels: [
        { title: "記憶博士の非常識な記憶学", id: "UCryn4Yq3e-cLf9opJ24pvCg", desc: "記憶法・学習法の解説" },
        { title: "WEB玉のタマえもん", id: "UCIigv9W8ChJl0P-28Eev8Jw", desc: "面白おかしく学ぶ授業動画" }
      ]
    }
  ];

  const YT_API_KEY = "AIzaSyBTcBTqGAI9theGS2R54kRImOLn5Fmt7Sk";

  const nav = document.getElementById("nav");
  const player = document.getElementById("player");
  const nowTitle = document.getElementById("now-title");
  const nowDesc = document.getElementById("now-desc");
  const videoListEl = document.getElementById("video-list");
  const videoCountEl = document.getElementById("video-count");
  const searchInput = document.getElementById("video-search");

  let currentChannel = null;
  let allVideos = [];

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
  }

  function playVideo(video, itemEl) {
    player.src = "https://www.youtube-nocookie.com/embed/" + video.videoId + "?rel=0&modestbranding=1&autoplay=1";
    nowTitle.textContent = video.title;
    nowDesc.textContent = video.channelTitle || "";
    document.querySelectorAll(".video-item").forEach(el => el.classList.remove("active"));
    if (itemEl) itemEl.classList.add("active");
  }

  function renderVideoList(autoPlayFirst) {
    const term = searchInput.value.trim().toLowerCase();
    const filtered = term
      ? allVideos.filter(v => v.title.toLowerCase().includes(term))
      : allVideos;

    videoListEl.innerHTML = "";

    if (filtered.length === 0) {
      const msg = allVideos.length === 0 ? "動画が見つかりませんでした。" : "該当する動画がありません。";
      videoListEl.innerHTML = '<p class="video-list-status">' + msg + '</p>';
    } else {
      filtered.forEach((video, i) => {
        const item = document.createElement("button");
        item.className = "video-item";
        item.innerHTML =
          '<img src="' + escapeHtml(video.thumbnail) + '" alt="" loading="lazy">' +
          '<span class="vi-title">' + escapeHtml(video.title) + '</span>';
        item.addEventListener("click", () => playVideo(video, item));
        videoListEl.appendChild(item);
        if (autoPlayFirst && i === 0) {
          playVideo(video, item);
        }
      });
    }

    videoCountEl.textContent = allVideos.length === 0
      ? ""
      : (filtered.length === allVideos.length
          ? allVideos.length + "本"
          : filtered.length + " / " + allVideos.length + "本");
  }

  async function fetchPlaylistPage(playlistId, pageToken) {
    const url = new URL("https://www.googleapis.com/youtube/v3/playlistItems");
    url.searchParams.set("part", "snippet");
    url.searchParams.set("maxResults", "50");
    url.searchParams.set("playlistId", playlistId);
    url.searchParams.set("key", YT_API_KEY);
    if (pageToken) url.searchParams.set("pageToken", pageToken);

    const res = await fetch(url);
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const message = data && data.error && data.error.message ? data.error.message : ("HTTP " + res.status);
      throw new Error(message);
    }
    return data;
  }

  async function loadChannelVideos(channel) {
    const playlistId = "UU" + channel.id.slice(2);

    allVideos = [];
    searchInput.value = "";
    searchInput.disabled = true;
    videoCountEl.textContent = "";
    videoListEl.innerHTML = '<p class="video-list-status">読み込み中…</p>';

    let pageToken = null;

    try {
      do {
        const data = await fetchPlaylistPage(playlistId, pageToken);

        const videos = (data.items || [])
          .filter(it => it.snippet && it.snippet.resourceId && it.snippet.resourceId.videoId)
          .map(it => {
            const thumbs = it.snippet.thumbnails || {};
            const thumb = thumbs.medium || thumbs.default || {};
            return {
              videoId: it.snippet.resourceId.videoId,
              title: it.snippet.title,
              thumbnail: thumb.url || "",
              channelTitle: channel.title
            };
          });

        allVideos = allVideos.concat(videos);
        pageToken = data.nextPageToken || null;
      } while (pageToken);

      renderVideoList(true);
    } catch (err) {
      if (allVideos.length > 0) {
        renderVideoList(true);
        videoListEl.insertAdjacentHTML(
          "beforeend",
          '<p class="video-list-status">続きの動画取得に失敗しました：' + escapeHtml(err.message) + '</p>'
        );
      } else {
        videoListEl.innerHTML = '<p class="video-list-status">動画一覧の取得に失敗しました：' + escapeHtml(err.message) + '</p>';
      }
    } finally {
      searchInput.disabled = false;
    }
  }

  function selectChannel(channel, btn) {
    currentChannel = channel;
    nowTitle.textContent = channel.title;
    nowDesc.textContent = channel.desc;
    document.querySelectorAll(".channel-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    loadChannelVideos(channel);
  }

  searchInput.addEventListener("input", () => renderVideoList(false));

  groups.forEach((group, gi) => {
    const label = document.createElement("div");
    label.className = "group-title";
    label.textContent = group.name;
    nav.appendChild(label);

    group.channels.forEach((channel, ci) => {
      const btn = document.createElement("button");
      btn.className = "channel-btn";
      btn.style.setProperty("--dot", group.color);
      btn.innerHTML = '<span class="dot"></span><span>' + channel.title + '</span>';
      btn.addEventListener("click", () => selectChannel(channel, btn));
      nav.appendChild(btn);

      if (gi === 0 && ci === 0) {
        // 初期表示として最初のチャンネルを選択
        setTimeout(() => selectChannel(channel, btn), 0);
      }
    });
  });
</script>

</body>
</html>
